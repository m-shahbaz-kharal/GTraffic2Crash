<title>Town Traffic Forecaster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5; --rule:#d7dce4;
  --ink:#12161d; --ink-2:#4a5261; --ink-3:#79808f;
  --car:#0b63d6; --large:#c25400; --wheel:#8a6a00;
  --good:#1a7a45; --bad:#b3261e;
  --grid:#c9d0da;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d1015; --surface:#141922; --surface-2:#1b212c; --rule:#28303c;
  --ink:#e2e7ef; --ink-2:#9aa4b4; --ink-3:#6d7787;
  --car:#4d9bff; --large:#ff8a34; --wheel:#ffd042;
  --good:#4fd18b; --bad:#ff6f61;
  --grid:#232a35;
}}
:root[data-theme="dark"]{
  --ground:#0d1015; --surface:#141922; --surface-2:#1b212c; --rule:#28303c;
  --ink:#e2e7ef; --ink-2:#9aa4b4; --ink-3:#6d7787;
  --car:#4d9bff; --large:#ff8a34; --wheel:#ffd042;
  --good:#4fd18b; --bad:#ff6f61;
  --grid:#232a35;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 96px}
.col{max-width:67ch}
h1,h2,h3{font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;text-wrap:balance;margin:0}
h1{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:700;letter-spacing:-.02em;line-height:1.02}
h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:600;letter-spacing:-.01em;line-height:1.15}
h3{font-size:1.12rem;font-weight:600;letter-spacing:.005em}
p{margin:0}
a{color:var(--car)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.lede{font-size:1.22rem;line-height:1.55;color:var(--ink-2)}
section{padding-top:74px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:10px}

header.hero{padding:76px 0 6px;border-bottom:1px solid var(--rule)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:52px;align-items:end}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr;gap:34px}}
.hero h1 em{font-style:normal;color:var(--car)}
.statusbox{
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px 20px;
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;line-height:1.85;
}
.statusbox .k{color:var(--ink-3)}
.statusbox .v{color:var(--ink);font-weight:500;float:right}
.statusbox div{border-bottom:1px dotted var(--rule);overflow:hidden}
.statusbox div:last-child{border-bottom:0}

/* the pipeline is genuinely a sequence, so it is numbered */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.step{background:var(--surface);padding:18px 18px 20px}
.step .n{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.14em;color:var(--car);font-weight:600}
.step h3{margin:7px 0 5px;font-size:1rem}
.step p{font-size:.85rem;color:var(--ink-2);line-height:1.5}

table{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--rule)}
th{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
tr.hi td{background:var(--surface-2);font-weight:600}
.good{color:var(--good);font-weight:600}
.bad{color:var(--bad);font-weight:600}

figure{margin:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--surface)}
figure img{display:block;width:100%;height:auto}
figcaption{padding:12px 16px;font-size:.83rem;color:var(--ink-2);border-top:1px solid var(--rule);line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}

.finding{border:1px solid var(--rule);border-radius:4px;background:var(--surface);overflow:hidden}
.finding > .top{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.finding .tag{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:2px;padding:2px 7px;white-space:nowrap}
.finding .body{display:grid;grid-template-columns:96px 1fr;gap:2px 18px;padding:16px 20px;font-size:.9rem}
@media(max-width:640px){.finding .body{grid-template-columns:1fr;gap:2px}}
.finding .body dt{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.finding .body dd{margin:0 0 12px;color:var(--ink-2)}
.finding .body dd:last-of-type{margin-bottom:0}

.callout{border-left:2px solid var(--car);padding:2px 0 2px 20px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.rule{height:1px;background:var(--rule);border:0;margin:0}
code{font-family:"IBM Plex Mono",monospace;font-size:.86em;background:var(--surface-2);padding:1px 5px;border-radius:3px}
.footnote{font-size:.85rem;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--car);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
